PositionDescription:
  yapily_k8s:
    Pages:
    - =>Page.k8s
    PositionID: =>Position.yapily
    Content: >-
      <h4>Platform Engineering & Architecture</h4>
      Architected and deployed a hybrid multi-cluster GKE strategy spanning 2 GCP regions for disaster recovery, establishing cross-regional failover capabilities by: bringing all resources under Terraform management, consolidating standalone scripts, building a passive secondary cluster, and orchestrating clean application deployment to the new region.
      Designed a self-service Internal Developer Platform (IDP) using Terraform and ArgoCD, enabling developer autonomy while implementing policies that enforce security and compliance standards — reducing misconfiguration incidents.
      Led the architecture review board for cloud-native designs and was instrumental in merging separate SRE and DevOps functions into a unified Platform Engineering division.
      <br/><br/><h4>Infrastructure as Code & Automation</h4>
      Replaced manual click-ops with Terraform configurations, introducing peer review processes for infrastructure changes to improve stability and knowledge sharing.
      Automated re-encryption processes for large volumes of sensitive data and implemented CI/CD automation tools and frameworks using JAVA/GoLang/Python.
      Conducted comprehensive systems tests for security, performance, and availability; analyzed code and delivered detailed reviews to development teams, ensuring marked application improvements and timely project completion.
      <br/><br/><h4>Open Source & Technical Contributions</h4>
      Contributed open source GoLang enhancements to Helm, enabling support for charts from private GitHub repositories, and developed a custom Terraform provider for Mozilla SOPS to write files using KMS.
      <br/><br/><h4>Observability & Operations</h4>
      Migrated to a dedicated in-cluster observability stack based on Prometheus/LGTM; troubleshoot and coordinate with development teams on CI/CD and observability issues.
      Optimized the company's computing architecture and applied cloud computing expertise to deploy upgrades and fixes.
      <br/><br/><h4>Compliance & Knowledge Sharing</h4>
      Assisted in achieving ISO27001 information security certification.
      Facilitated workshops between legacy operations and modern development teams, focusing on shared goals and incident retrospection.
      Delivered multiple engineering-wide training sessions on: Git rebasing best practices, migrating GCP resources to Terraform, IAM policy management in GCP, Docker build processes in BitBucket CI, and deployment release processes in ArgoCD.
      Modernized infrastructure documentation using AI-assisted tooling.

