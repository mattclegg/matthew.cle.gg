  yapily_people:
    Pages:
    - =>Page.people
    PositionID: =>Position.yapily
    Content: >-
      As an SRE a key focus of my role was coaching and training.
      I led the design and implementation of a cross-regional disaster recovery solution on GCP, which included managing all resources via Terraform, consolidating standalone scripts into automated processes, establishing a passive cluster in a secondary region, and deploying applications cleanly across regions.
      I actively gathered user feedback to design, develop, and deploy software integrations. I troubleshot production issues and collaborated closely with development teams to streamline code deployments, applying cloud computing expertise to roll out upgrades and fixes.
      To advance reliability and security, I implemented CI/CD pipelines, automated the re-encryption of large volumes of sensitive data, and conducted systems tests for security, performance, and availability. I also analyzed code, delivered detailed reviews to development teams, and drove measurable improvements in application quality and project timelines.
      I optimized the company’s cloud computing architecture and supported the acquisition of ISO27001 information security standards. As part of my commitment to open source, I contributed to the Terraform provider for Mozilla SOPS, enabling KMS-based file writing.
      I delivered multiple engineering-wide sessions—including Git rebasing practices and migrating GCP resources into Terraform—to upskill teams and embed SRE principles across the organization.
